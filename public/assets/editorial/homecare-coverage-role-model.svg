<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Homecare and eldercare information model separating medical and nonclinical roles coverage and bookings"><title>Homecare and eldercare information model separating medical and nonclinical roles coverage and bookings</title><rect width="1200" height="680" fill="#FFFFFF"/><rect x="16" y="16" width="1168" height="648" rx="28" fill="#F6F1FC" stroke="#E3D9F0"/><circle cx="1120" cy="76" r="120" fill="#EFE2FC" opacity=".58"/><circle cx="1100" cy="644" r="140" fill="#E6F1EF" opacity=".65"/><text x="55" y="74" fill="#231143" font-family="Inter,Arial,sans-serif" font-size="33" font-weight="750" text-anchor="start">Homecare website: role, coverage and responsibility</text><text x="56" y="112" fill="#62707F" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start">Clarity for families before the first enquiry</text><rect x="53" y="180" width="245" height="215" rx="20" fill="#FFFFFF" stroke="#E5DDED" stroke-width="1.5"/><circle cx="88" cy="216" r="17" fill="#330072"/><text x="88" y="223" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">1</text><text x="115" y="223" fill="#231143" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">Service type</text><text x="73" y="263" fill="#62707F" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Nursing vs support</text><text x="73" y="288" fill="#62707F" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Explain boundaries</text><path d="M 298 276 L 319 276" fill="none" stroke="#330072" stroke-opacity=".50" stroke-width="3" stroke-linecap="round"/><path d="M 316 268 L 329 276 L 316 284" fill="none" stroke="#330072" stroke-width="3" stroke-linejoin="round"/><rect x="333" y="180" width="245" height="215" rx="20" fill="#FFFFFF" s