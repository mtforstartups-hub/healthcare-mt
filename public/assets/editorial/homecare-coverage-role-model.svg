e cx="928" cy="216" r="17" fill="#330072"/><text x="928" y="223" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">4</text><text x="955" y="223" fill="#231143" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">Family enquiry</text><text x="913" y="263" fill="#62707F" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Minimal details</text><text x="913" y="288" fill="#62707F" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Scheduling response</text><rect x="53" y="434" width="1085" height="118" rx="20" fill="#F4F1EA" stroke="#D9CEC0" stroke-width="1.5"/><text x="82" y="475" fill="#231143" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start">Do not merge medical care, nonmedical support, and emergency response.</text><text x="82" y="509" fill="#62707F" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start">The website can confirm a service request, not a clinical care plan or universal staff availability.</text><rect x="55" y="614" width="1090" height="1" fill="#D9D6E1"/><text x="55" y="641" fill="#330072" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="750" text-anchor="start">MARKETING TUSK HEALTHCARE</text><text x="1145" y="641" fill="#62707F" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="end">Illustrative framework · Not a clinical assessment</text></svg>