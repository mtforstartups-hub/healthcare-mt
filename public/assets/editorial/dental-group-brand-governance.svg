<text x="155" y="244" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">01 · CORPORATE</text>
<text x="91" y="305" fill="#1D2741" font-size="27" font-weight="700">Identity system</text><text x="91" y="342" fill="#526279" font-size="17">Name, logo, type, spacing,</text><text x="91" y="368" fill="#526279" font-size="17">templates</text><circle cx="216" cy="428" r="13" fill="#330072" opacity=".16"/><path d="M210 428 l5 5 l11 -13" fill="none" stroke="#330072" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M369 338 H405" stroke="#7F72A8" stroke-width="3" stroke-linecap="round"/><path d="M398 330 l10 8 l-10 8" fill="none" stroke="#7F72A8" stroke-width="3"/><rect x="423" y="198" width="295" height="279" rx="23" fill="#EAF3F2" stroke="#D6CFE5" stroke-width="1.4"/>
