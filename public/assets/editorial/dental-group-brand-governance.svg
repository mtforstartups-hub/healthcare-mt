<text x="510" y="244" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">02 · BRANCH</text>
<text x="446" y="305" fill="#1D2741" font-size="27" font-weight="700">Local facts</text><text x="446" y="342" fill="#526279" font-size="17">Address, hours, team,</text><text x="446" y="368" fill="#526279" font-size="17">genuine services</text><circle cx="571" cy="428" r="13" fill="#155E63" opacity=".16"/><path d="M565 428 l5 5 l11 -13" fill="none" stroke="#155E63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M724 338 H760" stroke="#7F72A8" stroke-width="3" stroke-linecap="round"/><path d="M753 330 l10 8 l-10 8" fill="none" stroke="#7F72A8" stroke-width="3"/><rect x="778" y="198" width="295" height="279" rx="23" fill="#F3F0FA" stroke="#D6CFE5" stroke-width="1.4"/>
<rect x="803" y="223" width="125" height="31" rx="15.5" fill="#330072"/>
<text x="865" y="244" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">03 · REVIEW</text>
<text x="801" y="305" fill="#1D2741" font-size="27" font-weight="700">Separate sign-offs</text><text x="801" y="342" fill="#526279" font-size="17">Operations facts and dental</text><text x="801" y="368" fill="#526279" font-size="17">claims</text><circle cx="926" cy="428" r="13" fill="#330072" opacity=".16"/><path d="M920 428 l5 5 l11 -13" fill="none" stroke="#330072" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M1079 338 H1115" stroke="#7F72A8" stroke-width="3" stroke-linecap="round"/><path d="M1108 330 l10 8 l-10 8" fill="none" stroke="#7F72A8" stroke-width="3"/><rect x="1133" y="198" width="295" height="279" rx="23" fill="#EAF3F2" stroke="#D6CFE5" stroke-width="1.4"/>
<rect x="1158" y="223" width="125" height="31" rx="15.5" fill="#155E63"/>
<text x="1220" y="244" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">04 · PUBLISH</text>
<text x="1156" y="305" fill="#1D2741" font-size="27" font-weight="700">Controlled updates</text><text x="1156" y="342" fill="#526279" font-size="17">Website, listings,</text><text x="1156" y="368" fill="#526279" font-size="17">documents, signage</text><circle cx="1281" cy="428" r="13" fill="#155E63" opacity=".16"/><path d="M1275 428 l5 5 l11 -13" fill="none" stroke="#155E63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="540" width="446" height="76" rx="18" fill="#F9FAFC" stroke="#DFE4ED"/><circle cx="99" cy="576" r="10" fill="#3F958B"/><text x="121" y="582" fill="#394661" font-size="17" font-weight="600">Real-world branch identity</text><rect x="534" y="540" width="446" height="76" rx="18" fill="#F9FAFC" stroke="#DFE4ED"/><circle cx="565" cy="576" r="10" fill="#3F958B"/><text x="587" y="582" fill="#394661" font-size="17" font-weight="600">Authorized edits &amp; source control</text><rect x="1000" y="540" width="446" height="76" rx="18" fill="#F9FAFC" stroke="#DFE4ED"/><circle cx="1031" cy="576" r="10" fill="#3F958B"/><text x="1053" y="582" fill="#394661" font-size="17" font-weight="600">Professional ethics review</text></g>
<text x="68" y="649" fill="#7B8495" font-size="14" font-family="Arial,Helvetica,sans-serif">Marketing Tusk Healthcare · Original conceptual workflow · No actual patient data or performance results</text>
