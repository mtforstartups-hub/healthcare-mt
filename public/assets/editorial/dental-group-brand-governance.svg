<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 700" role="img" aria-labelledby="t d">
<title id="t">Dental Group Brand Governance </title><desc id="d">A single brand identity with verified branch-specific facts and gated clinical claims. Four labeled steps with three governance checks. Conceptual illustration only.</desc>
