<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="t d"><title id="t">Healthcare brand identity | governance map</title><desc id="d">Facts and design follow different approval paths</desc><rect width="1600" height="860" fill="#F9F7F4"/><rect width="1600" height="18" fill="#330072"/><text x="94" y="102" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="41" fill="#330072">Healthcare brand identity | governance map</text><text x="95" y="145" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#25223A">Facts and design follow different approval paths</text><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#330072"/></marker></defs><rect x="93" y="230" width="440" height="210" rx="22" fill="#FFFFFF" stroke="#D7D2E3" stroke-width="2"/><circle cx="135" cy="277" r="21" fill="#330072"/><text x="135" y="284" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="white">1</text><text x="169" y="286" font-family="Arial" font-size="24" font-weight="700" fill="#330072">Verified identity</text><text x="128" y="335" font-family="Arial" font-size="19" fill="#25223A">Institution name and locations</text><text x="128" y="368" font-family="Arial" font-size="19" fill="#25223A">Credentials and operating facts</text><rect x="580" y="230" width="440" height="210" rx="22" fill="#FFFFFF" stroke="#D7D2E3" stroke-width="2"/><circle cx="622" cy="277" r="21" fill="#330072"/><text x="622" y="284" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="white">2</text><text x="656" y="286" font-family="Arial" font-size="24" font-weight="700" fill="#330072">Shared visual system</text><text x="615" y="335" font-family="Arial" font-size="19" fill="#25223A">Logo, type, colours, templates</text><text x="615" y="368" font-family="Arial" font-size="19" fill="#25223A">Readable text and action styles</text><rect x="1067" y="230" width="440" height="210" rx="22" fill="#FFFFFF" stroke="#D7D2E3" stroke-width="2"/><circle cx="1109" cy="277" r="21" fill="#330072"/><text x="1109" y="284" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="white">3</text><text x="1143" y="286" font-family="Arial" font-size="24" font-weight="700" fill="#330072">Local deployment</text><text x="1102" y="335" font-family="Arial" font-size="19" fill="#25223A">Web, signage and listings</text><text x="1102" y="368" font-family="Arial" font-size="19" fill="#25223A">Branch-specific information</text><rect x="580" y="540" width="440" height="160" rx="22" fill="#FFFFFF" stroke="#D7D2E3" stroke-width="2"/><circle cx="622" cy="587" r="21" fill="#330072"/><text x="622" y="594" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="white">4</text><text x="656" y="596" font-family="Arial" font-size="24" font-weight="700" fill="#330072">Approval checkpoint</text><text x="615" y="645" font-family="Arial" font-size="19" fill="#25223A">Brand owner + qualified reviewer</text><text x="615" y="678" font-family="Arial" font-size="19" fill="#25223A">Version history + correction route</text><path d="M533,335 L579,335" stroke="#330072" stroke-width="5" fill="none" marker-end="url(#ar)"/><path d="M1020,335 L1066,335" stroke="#330072" stroke-width="5" fill="none" marker-end="url(#ar)"/><path d="M1280,437 L1280,610" stroke="#330072" stroke-width="5" fill="none" marker-end="url(#ar)"/><path d="M1280,610 L1024,610" stroke="#330072" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="94" y="798" font-family="Arial" font-size="19" fill="#330072">MARKETING TUSK HEALTHCARE   /   ORIGINAL CONCEPTUAL WORKFLOW</text></svg>