<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="t d"><title id="t">Healthcare website usability | test cycle</title><desc id="d">From visitor tasks to documented remediation</desc><rect width="1600" height="860" fill="#F9F7F4"/><rect width="1600" height="18" fill="#330072"/><text x="94" y="102" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="41" fill="#330072">Healthcare website usability | test cycle</text><text x="95" y="145" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#25223A">From visitor tasks to documented remediation</text><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#330072"/></marker></defs><rect x="93" y="224" width="680" height="190" rx="22" fill="#FFFFFF" stroke="#D7D2E3" stroke-width="2"/><circle cx="135" cy="271" r="21" fill="#330072"/><text x="135" y="278" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="white">1</text><text x="169" y="280" font-family="Arial" font-size="24" font-weight="700" fill="#330072">Map critical tasks</text><text x="128" y="329" font-family="Arial" font-size="19" fill="#25223A">Location, service, practitioner</text><text x="128" y="362" font-family="Arial" font-size="19" fill="#25223A">Appointment and contact routes</text><rect x="827" y="224" width="680" height="190" rx="22" fill="#FFFFFF" stroke="#D7D2E3" stroke-width="2"/><circle cx="869" cy="271" r="21" fill="#330072"/><text x="869" y="278" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="white">2</text><text x="903" y="280" font-family="Arial" font-size="24" font-weight="700" fill="#330072">Test interactions</text><text x="862" y="329" font-family="Arial" font-size="19" fill="#25223A">Keyboard, mobile, zoom, forms</text><text x="862" y="362" font-family="Arial" font-size="19" fill="#25223A">Contrast and assistive workflows</text><rect x="93" y="488" width="680" height="190" rx="22" fill="#FFFFFF" stroke="#D7D2E3" stroke-width="2"/><circle cx="135" cy="535" r="21" fill="#330072"/><text x="135" y="542" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="white">3</text><text x="169" y="544" font-family="Arial" font-size="24" font-weight="700" fill="#330072">Prioritise repairs</text><text x="128" y="593" font-family="Arial" font-size="19" fill="#25223A">Blockers, high and medium issues</text><text x="128" y="626" font-family="Arial" font-size="19" fill="#25223A">Owner, URL, reproduction steps</text><rect x="827" y="488" width="680" height="190" rx="22" fill="#FFFFFF" stroke="#D7D2E3" stroke-width="2"/><circle cx="869" cy="535" r="21" fill="#330072"/><text x="869" y="542" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="white">4</text><text x="903" y="544" font-family="Arial" font-size="24" font-weight="700" fill="#330072">Retest and maintain</text><text x="862" y="593" font-family="Arial" font-size="19" fill="#25223A">Confirm corrected journeys</text><text x="862" y="626" font-family="Arial" font-size="19" fill="#25223A">Keep release-time quality gates</text><path d="M773,318 L826,318" stroke="#330072" stroke-width="5" fill="none" marker-end="url(#ar)"/><path d="M1170,416 L1170,483" stroke="#330072" stroke-width="5" fill="none" marker-end="url(#ar)"/><path d="M826,590 L772,590" stroke="#330072" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="94" y="798" font-family="Arial" font-size="19" fill="#330072">MARKETING TUSK HEALTHCARE   /   ORIGINAL CONCEPTUAL WORKFLOW</text></svg>