<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="heading description">
<title id="heading">Homeopathy claims: evidence and decision log</title>
<desc id="description">Review wording, surrounding visuals, source quality and potential impact. No blanket cure promises  •  Do not discourage evidence-based care</desc>
