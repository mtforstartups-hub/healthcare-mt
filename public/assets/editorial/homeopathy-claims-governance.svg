<text x="401" y="420" font-family="Arial" font-size="30" font-weight="700" fill="#330072">Classify</text>
<text x="401" y="476" font-family="Arial" font-size="23" fill="#1B2340">Nature of the</text>
<text x="401" y="509" font-family="Arial" font-size="23" fill="#1B2340">claim</text>
<text x="401" y="565" font-family="Arial" font-size="21" fill="#526077">Efficacy / safety</text>
<text x="401" y="594" font-family="Arial" font-size="21" fill="#526077">/ testimonial</text>
