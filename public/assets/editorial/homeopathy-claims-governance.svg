<text x="98" y="420" font-family="Arial" font-size="30" font-weight="700" fill="#330072">Inventory</text>
<text x="98" y="476" font-family="Arial" font-size="23" fill="#1B2340">Exact URL and</text>
<text x="98" y="509" font-family="Arial" font-size="23" fill="#1B2340">context</text>
<text x="98" y="565" font-family="Arial" font-size="21" fill="#526077">Capture all public</text>
<text x="98" y="594" font-family="Arial" font-size="21" fill="#526077">versions</text>
