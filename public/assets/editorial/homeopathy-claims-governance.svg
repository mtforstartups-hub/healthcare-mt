<text x="1341" y="350" font-family="Arial" font-size="23" font-weight="700" fill="white" text-anchor="middle">05</text>
<text x="1310" y="420" font-family="Arial" font-size="30" font-weight="700" fill="#330072">Recheck</text>
<text x="1310" y="476" font-family="Arial" font-size="23" fill="#1B2340">Derived copies</text>
<text x="1310" y="509" font-family="Arial" font-size="23" fill="#1B2340">and metadata</text>
<text x="1310" y="565" font-family="Arial" font-size="21" fill="#526077">Confirm public</text>
<text x="1310" y="594" font-family="Arial" font-size="21" fill="#526077">correction</text>
