<text x="704" y="420" font-family="Arial" font-size="30" font-weight="700" fill="#330072">Verify</text>
<text x="704" y="476" font-family="Arial" font-size="23" fill="#1B2340">Scientific source</text>
<text x="704" y="509" font-family="Arial" font-size="23" fill="#1B2340">and law</text>
<text x="704" y="565" font-family="Arial" font-size="21" fill="#526077">Support must match</text>
<text x="704" y="594" font-family="Arial" font-size="21" fill="#526077">wording</text>
