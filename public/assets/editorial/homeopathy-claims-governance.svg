<text x="1007" y="509" font-family="Arial" font-size="23" fill="#1B2340">remove</text>
<text x="1007" y="565" font-family="Arial" font-size="21" fill="#526077">Named qualified</text>
<text x="1007" y="594" font-family="Arial" font-size="21" fill="#526077">reviewer</text>
