ence is not a booking</text><rect x="1067" y="218" width="440" height="200" rx="22" fill="#FFFFFF" stroke="#D7D2E3" stroke-width="2"/><circle cx="1109" cy="265" r="21" fill="#330072"/><text x="1109" y="272" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="white">3</text><text x="1143" y="274" font-family="Arial" font-size="24" font-weight="700" fill="#330072">Acknowledge</text><text x="1102" y="323" font-family="Arial" font-size="19" fill="#25223A">Accurate submission status</text><text x="1102" y="356" font-family="Arial" font-size="19" fill="#25223A">Routine / urgent routes clear</text><rect x="580" y="522" width="440" height="175" rx="22" fill="#FFFFFF" stroke="#D7D2E3" stroke-width="2"/><circle cx="622" cy="569" r="21" fill="#330072"/><text x="622" y="576" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="white">4</text><text x="656" y="578" font-family="Arial" font-size="24" font-weight="700" fill="#330072">Resolve with staff</text><text x="615" y="627" font-family="Arial" font-size="19" fill="#25223A">Owner, backup and closure</text><text x="615" y="660" font-family="Arial" font-size="19" fill="#25223A">Privacy and exceptions reviewed</text><path d="M533,335 L579,335" stroke="#330072" stroke-width="5" fill="none" marker-end="url(#ar)"/><path d="M1020,335 L1066,335" stroke="#330072" stroke-width="5" fill="none" marker-end="url(#ar)"/><path d="M1280,437 L1280,610" stroke="#330072" stroke-width="5" fill="none" marker-end="url(#ar)"/><path d="M1280,610 L1024,610" stroke="#330072" stroke-width="5" fill="none" marker-end="url(#ar)"/><text x="94" y="798" font-family="Arial" font-size="19" fill="#330072">MARKETING TUSK HEALTHCARE   /   ORIGINAL CONCEPTUAL WORKFLOW</text></svg>