<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 700" role="img" aria-labelledby="t d">
<title id="t">Multispecialty Administrative Workflow </title><desc id="d">Administrative requests must remain distinct from confirmed appointments and clinical decisions. Four labeled steps with three governance checks. Conceptual illustration only.</desc>
<rect width="1500" height="700" fill="#FFFEFD"/><rect x="28" y="25" width="1444" height="647" rx="32" fill="#FFFFFF" stroke="#E8E3F1" stroke-width="2"/>
<text x="68" y="91" fill="#330072" font-size="36" font-family="Arial,Helvetica,sans-serif" font-weight="700">Multispecialty Administrative Workflow </text>
<text x="68" y="133" fill="#5A6575" font-size="20" font-family="Arial,Helvetica,sans-serif">Administrative requests must remain distinct from confirmed appointments and clinical decisions</text>
<path d="M68 159 H1433" stroke="#E2DDEA" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif"><rect x="68" y="198" width="295" height="279" rx="23" fill="#F3F0FA" stroke="#D6CFE5" stroke-width="1.4"/>
<rect x="93" y="223" width="125" height="31" rx="15.5" fill="#330072"/>
<text x="155" y="244" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">01 · REQUEST</text>
<text x="91" y="305" fill="#1D2741" font-size="27" font-weight="700">Contact received</text><text x="91" y="342" fill="#526279" font-size="17">Branch, department, contact</text><text x="91" y="368" fill="#526279" font-size="17">preference</text><circle cx="216" cy="428" r="13" fill="#330072" opacity=".16"/><path d="M210 428 l5 5 l11 -13" fill="none" stroke="#330072" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M369 338 H405" stroke="#7F72A8" stroke-width="3" stroke-linecap="round"/><path d="M398 330 l10 8 l-10 8" fill="none" stroke="#7F72A8" stroke-width="3"/><rect x="423" y="198" width="295" height="279" rx="23" fill="#EAF3F2" stroke="#D6CFE5" stroke-width="1.4"/>
<rect x="448" y="223" width="125" height="31" rx="15.5" fill="#155E63"/>
<text x="510" y="244" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">02 · ROUTE</text>
<text x="446" y="305" fill="#1D2741" font-size="27" font-weight="700">Assigned to desk</text><text x="446" y="342" fill="#526279" font-size="17">Owner, queue, exception</text><text x="446" y="368" fill="#526279" font-size="17">fallback</text><circle cx="571" cy="428" r="13" fill="#155E63" opacity=".16"/><path d="M565 428 l5 5 l11 -13" fill="none" stroke="#155E63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M724 338 H760" stroke="#7F72A8" stroke-width="3" stroke-linecap="round"/><path d="M753 330 l10 8 l-10 8" fill="none" stroke="#7F72A8" stroke-width="3"/><rect x="778" y="198" width="295" height="279" rx="23" fill="#F3F0FA" stroke="#D6CFE5" stroke-width="1.4"/>
<rect x="803" y="223" width="125" height="31" rx="15.5" fill="#330072"/>
<text x="865" y="244" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">03 · VERIFY</text>
<text x="801" y="305" fill="#1D2741" font-size="27" font-weight="700">Staff check</text><text x="801" y="342" fill="#526279" font-size="17">Availability, schedule,</text><text x="801" y="368" fill="#526279" font-size="17">other issues</text><circle cx="926" cy="428" r="13" fill="#330072" opacity=".16"/><path d="M920 428 l5 5 l11 -13" fill="none" stroke="#330072" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M1079 338 H1115" stroke="#7F72A8" stroke-width="3" stroke-linecap="round"/><path d="M1108 330 l10 8 l-10 8" fill="none" stroke="#7F72A8" stroke-width="3"/><rect x="1133" y="198" width="295" height="279" rx="23" fill="#EAF3F2" stroke="#D6CFE5" stroke-width="1.4"/>
<rect x="1158" y="223" width="125" height="31" rx="15.5" fill="#155E63"/>
<text x="1220" y="244" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">04 · CLOSE</text>
<text x="1156" y="305" fill="#1D2741" font-size="27" font-weight="700">Status &amp; follow-up</text><text x="1156" y="342" fill="#526279" font-size="17">Acknowledged, confirmed or</text><text x="1156" y="368" fill="#526279" font-size="17">escalated</text><circle cx="1281" cy="428" r="13" fill="#155E63" opacity=".16"/><path d="M1275 428 l5 5 l11 -13" fill="none" stroke="#155E63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="540" width="446" height="76" rx="18" fill="#F9FAFC" stroke="#DFE4ED"/><circle cx="99" cy="576" r="10" fill="#3F958B"/><text x="121" y="582" fill="#394661" font-size="17" font-weight="600">No automatic diagnosis</text><rect x="534" y="540" width="446" height="76" rx="18" fill="#F9FAFC" stroke="#DFE4ED"/><circle cx="565" cy="576" r="10" fill="#3F958B"/><text x="587" y="582" fill="#394661" font-size="17" font-weight="600">No false booking confirmation</text><rect x="1000" y="540" width="446" height="76" rx="18" fill="#F9FAFC" stroke="#DFE4ED"/><circle cx="1031" cy="576" r="10" fill="#3F958B"/><text x="1053" y="582" fill="#394661" font-size="17" font-weight="600">Role-restricted task records</text></g>
<text x="68" y="649" fill="#7B8495" font-size="14" font-family="Arial,Helvetica,sans-serif">Marketing Tusk Healthcare · Original conceptual workflow · No actual patient data or performance results</text>
</svg>