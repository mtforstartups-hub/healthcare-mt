<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">Mental Health Content Safeguards</title>
<desc id="svgdesc">Different content types require different reviewers and escalation routes; No clinical diagnosis, recovery promise, or emergency response by an ordinary form.</desc>
