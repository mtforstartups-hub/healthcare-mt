<text x="174" y="545" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="white">03</text>
<text x="236" y="534" font-family="Arial" font-size="31" font-weight="700" fill="#182639">Protect</text>
<text x="236" y="576" font-family="Arial" font-size="24" fill="#435468">Minimise child data</text>
<text x="236" y="620" font-family="Arial" font-size="21" fill="#657985">Avoid identifying imagery</text>
