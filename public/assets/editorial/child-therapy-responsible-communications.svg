<text x="884" y="306" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="white">02</text>
<text x="946" y="295" font-family="Arial" font-size="31" font-weight="700" fill="#182639">Identify</text>
<text x="946" y="337" font-family="Arial" font-size="24" fill="#435468">Correct professional roles</text>
<text x="946" y="381" font-family="Arial" font-size="21" fill="#657985">RCI where applicable</text>
