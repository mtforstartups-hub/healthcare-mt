<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title-svg desc-svg">
<title id="title-svg">Child therapy responsible communications workflow</title>
<desc id="desc-svg">Caregiver clarity with professional accuracy and safeguarding. Caregiver information is not online diagnosis</desc>
